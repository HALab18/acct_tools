<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
    <filter id="cardshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="180" height="180" fill="url(#grad)"/>

  <circle cx="140" cy="40" r="45" fill="#ffffff" opacity="0.08"/>
  <circle cx="50" cy="140" r="35" fill="#ffffff" opacity="0.06"/>

  <path d="M 65 75 Q 75 70 85 72 Q 95 68 100 75 Q 105 80 100 90 Q 90 95 80 92 Q 70 90 65 85 Z" fill="#ffffff" opacity="0.35"/>
  <path d="M 85 88 Q 95 85 105 90 Q 110 95 105 105 Q 95 110 85 105 Q 80 100 85 88 Z" fill="#ffffff" opacity="0.25"/>

  <path d="M 40 118 Q 30 108 30 98 Q 30 91 37 91 Q 42 91 45 95 Q 48 91 53 91 Q 60 91 60 98 Q 60 108 50 118 Z" fill="#fbbf24" opacity="0.9" filter="url(#shadow)"/>

  <circle cx="140" cy="128" r="17" fill="#fbbf24" opacity="0.85" filter="url(#shadow)"/>
  <text x="140" y="134" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1e40af" text-anchor="middle">¥</text>

  <rect x="50" y="42" width="80" height="98" rx="18" fill="#0f172a" opacity="0.42" filter="url(#cardshadow)"/>
  <rect x="50" y="42" width="80" height="98" rx="18" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.18"/>
  <text x="90" y="93" font-family="'Noto Serif JP','Hiragino Mincho ProN',serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">ふ</text>
  <text x="90" y="137" font-family="'Noto Serif JP','Hiragino Mincho ProN',serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">納</text>

  <line x1="20" y1="18" x2="160" y2="18" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
