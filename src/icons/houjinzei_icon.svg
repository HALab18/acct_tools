<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0369a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="180" height="180" fill="url(#grad)"/>

  <circle cx="150" cy="50" r="50" fill="#ffffff" opacity="0.08"/>
  <circle cx="40" cy="130" r="40" fill="#ffffff" opacity="0.06"/>

  <rect x="50" y="65" width="80" height="60" fill="#ffffff" opacity="0.25" rx="4" filter="url(#shadow)"/>
  <rect x="55" y="70" width="14" height="14" fill="#fbbf24" opacity="0.8" rx="2"/>
  <rect x="75" y="70" width="14" height="14" fill="#fbbf24" opacity="0.8" rx="2"/>
  <rect x="95" y="70" width="14" height="14" fill="#fbbf24" opacity="0.8" rx="2"/>
  <rect x="55" y="90" width="14" height="14" fill="#fbbf24" opacity="0.6" rx="2"/>
  <rect x="75" y="90" width="14" height="14" fill="#fbbf24" opacity="0.6" rx="2"/>
  <rect x="95" y="90" width="14" height="14" fill="#fbbf24" opacity="0.6" rx="2"/>
  <rect x="55" y="110" width="14" height="14" fill="#fbbf24" opacity="0.4" rx="2"/>
  <rect x="75" y="110" width="14" height="14" fill="#fbbf24" opacity="0.4" rx="2"/>
  <rect x="95" y="110" width="14" height="14" fill="#fbbf24" opacity="0.4" rx="2"/>

  <rect x="60" y="130" width="8" height="15" fill="#ffffff" opacity="0.7"/>
  <rect x="72" y="125" width="8" height="20" fill="#ffffff" opacity="0.8"/>
  <rect x="84" y="120" width="8" height="25" fill="#ffffff" opacity="0.9" filter="url(#shadow)"/>
  <rect x="96" y="127" width="8" height="18" fill="#ffffff" opacity="0.7"/>

  <line x1="20" y1="18" x2="160" y2="18" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
</svg>
