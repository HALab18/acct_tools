<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
    <filter id="cardshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="180" height="180" fill="url(#grad)"/>

  <circle cx="148" cy="38" r="50" fill="#ffffff" opacity="0.08"/>
  <circle cx="30" cy="148" r="38" fill="#ffffff" opacity="0.06"/>

  <rect x="26" y="98" width="42" height="38" fill="#ffffff" opacity="0.2" rx="4"/>
  <rect x="26" y="98" width="42" height="10" fill="#ffffff" opacity="0.3" rx="4"/>
  <circle cx="34" cy="118" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="47" cy="118" r="2.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="60" cy="118" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="34" cy="128" r="2.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="47" cy="128" r="2.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="60" cy="128" r="2.5" fill="#ffffff" opacity="0.4"/>

  <path d="M 128 128 L 133 133 L 143 122" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

  <rect x="50" y="42" width="80" height="98" rx="18" fill="#0f172a" opacity="0.42" filter="url(#cardshadow)"/>
  <rect x="50" y="42" width="80" height="98" rx="18" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.18"/>
  <text x="90" y="93" font-family="'Noto Serif JP','Hiragino Mincho ProN',serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">借</text>
  <text x="90" y="137" font-family="'Noto Serif JP','Hiragino Mincho ProN',serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">返</text>

  <line x1="20" y1="18" x2="160" y2="18" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
