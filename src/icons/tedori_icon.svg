  <line x1="29" y1="119" x2="53" y2="119" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
  <line x1="29" y1="126" x2="55" y2="126" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>

  <path d="M 122 132 L 138 132 M 134 127 L 138 132 L 134 137" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
